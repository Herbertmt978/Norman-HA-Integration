---
name: Tests

"on":
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements_test.txt

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run focused unit tests
        run: python -m pytest tests -q

  home-assistant:
    name: Home Assistant ${{ matrix.name }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 2024.11 minimum
            python: "3.12"
            requirements: requirements_ha_minimum.txt
            coverage: false
          - name: current
            python: "3.14"
            requirements: requirements_ha_current.txt
            coverage: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install Home Assistant test harness
        run: python -m pip install --requirement "${{ matrix.requirements }}"

      - name: Run minimum Home Assistant tests
        if: ${{ matrix.coverage == false }}
        run: python -m pytest ha_tests -q

      - name: Run combined coverage on current Home Assistant
        if: ${{ matrix.coverage }}
        env:
          COVERAGE_SOURCE: custom_components.norman_gen1
        run: |
          python -m mypy custom_components/norman_gen1 --strict
          python -m coverage erase
          python -m coverage run --branch \
            --source="$COVERAGE_SOURCE" -m pytest ha_tests -q
          python -m coverage report --omit="*/api.py" \
            --show-missing --fail-under=95
          python -m coverage report --include="*/config_flow.py" \
            --show-missing --fail-under=100
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            python -m coverage run --append --branch \
              --source="$COVERAGE_SOURCE" -m pytest \
              -p pytest_asyncio.plugin tests -q
          python -m coverage report --show-missing --fail-under=95

  home-assistant-latest:
    name: Latest Home Assistant compatibility watch
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install latest Home Assistant test harness
        run: python -m pip install pytest-homeassistant-custom-component mypy

      - name: Test against latest Home Assistant
        run: |
          python -m mypy custom_components/norman_gen1 --strict
          python -m pytest ha_tests -q
